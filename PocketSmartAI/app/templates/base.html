<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>


<body>

<nav>

    <a
        class="brand"
        href="/"
    >
        PocketSmart
        <span>AI</span>
    </a>


    <div class="navlinks">

        <a href="/planner/home">
            Home
        </a>

        <a href="/planner/party">
            Party
        </a>

        <a href="/planner/jewelry">
            Jewelry
        </a>

        <a href="/dashboard">
            Dashboard
        </a>

        <a
            href="/login"
            id="authLink"
        >
            Login
        </a>

    </div>

</nav>


<main>

    {% block content %}
    {% endblock %}

</main>


<footer>

    PocketSmart AI &middot;
    Budget-aware recommendations &middot;

    <span id="year"></span>

</footer>


<!-- Main JavaScript -->
<script src="/static/css/js/app.js"></script>


{% block scripts %}
{% endblock %}


</body>

</html>
