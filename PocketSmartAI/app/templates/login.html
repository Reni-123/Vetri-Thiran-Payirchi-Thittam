{% extends "base.html" %}

{% block title %}
Login — PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth-card">

    <p class="eyebrow">
        WELCOME BACK
    </p>


    <h1>
        Sign in
    </h1>


    <form id="loginForm">

        <label>

            Email

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </label>


        <label>

            Password

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

        </label>


        <button
            class="btn primary"
            type="submit"
        >
            Login
        </button>


        <p
            id="message"
            class="message"
        ></p>

    </form>


    <p>

        New here?

        <a href="/register">
            Create an account
        </a>

    </p>

</div>

{% endblock %}
